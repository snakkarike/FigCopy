name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check JavaScript syntax
        run: |
          node --check chrome-extension/*.js
          node --check figma-plugin/*.js
          
      - name: Validate Manifests
        run: |
          node -e "require('./chrome-extension/manifest.json')"
          node -e "require('./figma-plugin/manifest.json')"
