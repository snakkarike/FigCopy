<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fff;
        --text: #000;
        --border: #e0e0e0;
        --hint: #666;
        --btn-bg: #000;
        --btn-text: #fff;
        --btn-hover: #222;
        --icon-fill: #fff;
        --icon-stroke: #000;
        --logo-fill: #000;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --text: #fff;
          --border: #333;
          --hint: #aaa;
          --btn-bg: #fff;
          --btn-text: #000;
          --btn-hover: #ddd;
          --icon-fill: #000;
          --icon-stroke: #fff;
          --logo-fill: #fff;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 260px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-icon {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .body {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sub {
        margin: 0 0 4px;
        font-size: 11px;
        color: var(--hint);
        line-height: 1.5;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0;
        border: 1px solid var(--border);
      }

      button {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--btn-bg);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        background: var(--btn-bg);
        color: var(--btn-text);
        transition: background 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:hover {
        background: var(--btn-hover);
      }
      #fullPageBtn,
      #emulateBtn {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }
      #fullPageBtn:hover,
      #emulateBtn:hover {
        background: rgba(128, 128, 128, 0.1);
      }
      #emulateBtn.active-toggle {
        background: rgba(128, 128, 128, 0.2);
        border-color: var(--text);
      }

      .select-wrap {
        margin: 10px 0 12px;
        position: relative;
      }

      .select-wrap label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--hint);
        margin-bottom: 4px;
      }

      select {
        width: 100%;
        padding: 8px;
        font-size: 11px;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        outline: none;
        cursor: pointer;
        appearance: none;
      }

      .select-wrap::after {
        content: "▼";
        position: absolute;
        right: 10px;
        bottom: 8px;
        font-size: 8px;
        color: var(--hint);
        pointer-events: none;
      }

      #fullPageBtn {
        background: var(--bg);
        color: var(--text);
      }

      #fullPageBtn:hover {
        background: rgba(128, 128, 128, 0.1);
      }

      .btn-icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-bar {
        padding: 7px 14px;
        border-top: 1px solid var(--border);
        font-size: 10.5px;
        min-height: 28px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--hint);
      }

      .dot {
        width: 5px;
        height: 5px;
        background: var(--hint);
        flex-shrink: 0;
      }

      #status.ok {
        color: var(--text);
      }
      #status.ok .dot {
        background: var(--text);
      }
      #status.err {
        color: var(--text);
      }
      #status.err .dot {
        background: #f66;
      }
      #status.loading .dot {
        animation: pulse 0.7s infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.15;
        }
      }

      .toggle-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        font-size: 10px;
        color: var(--hint);
        padding: 2px 0;
      }
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 26px;
        height: 14px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--border);
        transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 14px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 10px;
        width: 10px;
        left: 2px;
        bottom: 2px;
        background-color: var(--bg);
        transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      input:checked + .slider {
        background-color: var(--text);
      }
      input:checked + .slider:before {
        transform: translateX(12px);
      }
    </style>
  </head>
  <body>

    <div class="body">
      <p class="sub">Capture an element or the full page, then paste the JSON or drag & drop the downloaded file into the Figma plugin.</p>

      <div class="select-wrap">
        <label>Viewport Width</label>
        <select id="viewportSelect">
          <option value="current">Current Window Size</option>
          <option value="1440">Desktop (1440px)</option>
          <option value="1024">Laptop (1024px)</option>
          <option value="768">Tablet (768px)</option>
          <option value="390">Mobile (390px)</option>
          <option value="custom">Custom...</option>
        </select>
      </div>

      <div id="customWidthWrap" style="display: none; margin-bottom: 12px">
        <input type="number" id="customWidthInput" placeholder="Width (px)" value="1200" style="width: 100%; padding: 8px; font-size: 11px; font-family: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); outline: none" />
      </div>

      <div class="btn-group">
        <button id="pickBtn">
          <span class="btn-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="1" width="4" height="4" stroke="var(--btn-text)" stroke-width="1.2" />
              <rect x="7" y="1" width="4" height="4" stroke="var(--btn-text)" stroke-width="1.2" />
              <rect x="1" y="7" width="4" height="4" stroke="var(--btn-text)" stroke-width="1.2" />
              <rect x="7" y="7" width="4" height="4" stroke="var(--btn-text)" stroke-width="1.2" />
            </svg>
          </span>
          Pick element
        </button>
        <button id="fullPageBtn">
          <span class="btn-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="0.6" y="0.6" width="10.8" height="10.8" stroke="var(--text)" stroke-width="1.2" />
              <line x1="0.6" y1="3.5" x2="11.4" y2="3.5" stroke="var(--text)" stroke-width="1.2" />
            </svg>
          </span>
          Full page
        </button>
        <button id="emulateBtn">
          <span class="btn-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 6C1 6 3 2 6 2C9 2 11 6 11 6C11 6 9 10 6 10C3 10 1 6 1 6Z" stroke="var(--text)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="6" cy="6" r="2" stroke="var(--text)" stroke-width="1.2" />
            </svg>
          </span>
          Toggle Emulation
        </button>
      </div>

      <div class="settings-wrap" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border)">
        <label class="toggle-wrap">
          <span>Download JSON instead of copying</span>
          <div class="toggle-switch">
            <input type="checkbox" id="downloadCheck" />
            <span class="slider"></span>
          </div>
        </label>
        <label class="toggle-wrap">
          <span>Skip form input values</span>
          <div class="toggle-switch">
            <input type="checkbox" id="skipFormValuesCheck" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </div>

    <div class="status-bar" id="status">
      <div class="dot"></div>
      <span id="statusText">Ready</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
