<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 260px;
      margin: 0;
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 16px;
      height: 16px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sub {
      margin: 0 0 4px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid #000;
    }

    button {
      width: 100%;
      padding: 9px 12px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s;
    }

    button + button {
      border-top: 1px solid #000;
    }

    #pickBtn {
      background: #000;
      color: #fff;
    }

    #pickBtn:hover { background: #222; }

    #fullPageBtn {
      background: #fff;
      color: #000;
    }

    #fullPageBtn:hover { background: #f0f0f0; }

    .btn-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-bar {
      padding: 7px 14px;
      border-top: 1px solid #e0e0e0;
      font-size: 10.5px;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
    }

    .dot {
      width: 5px;
      height: 5px;
      background: #ccc;
      flex-shrink: 0;
    }

    #status.ok { color: #000; }
    #status.ok .dot { background: #000; }
    #status.err { color: #000; }
    #status.err .dot { background: #000; }
    #status.loading .dot { animation: pulse 0.7s infinite alternate; }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.15; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="4.5" height="4.5" fill="white"/>
        <rect x="5.5" width="4.5" height="4.5" fill="white"/>
        <rect y="5.5" width="4.5" height="4.5" fill="white"/>
        <rect x="5.5" y="5.5" width="4.5" height="4.5" fill="white"/>
      </svg>
    </div>
    <span class="header-title">FigCopy</span>
  </div>

  <div class="body">
    <p class="sub">Capture an element or the full page, then paste into the Figma plugin.</p>
    <div class="btn-group">
      <button id="pickBtn">
        <span class="btn-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="4" height="4" stroke="white" stroke-width="1.2"/>
            <rect x="7" y="1" width="4" height="4" stroke="white" stroke-width="1.2"/>
            <rect x="1" y="7" width="4" height="4" stroke="white" stroke-width="1.2"/>
            <rect x="7" y="7" width="4" height="4" stroke="white" stroke-width="1.2"/>
          </svg>
        </span>
        Pick element
      </button>
      <button id="fullPageBtn">
        <span class="btn-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.6" y="0.6" width="10.8" height="10.8" stroke="black" stroke-width="1.2"/>
            <line x1="0.6" y1="3.5" x2="11.4" y2="3.5" stroke="black" stroke-width="1.2"/>
          </svg>
        </span>
        Full page
      </button>
    </div>
  </div>

  <div class="status-bar" id="status">
    <div class="dot"></div>
    <span id="statusText">Ready</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
