<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #17151F;
      color: #EDEBFA;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    p.sub {
      margin: 0 0 14px;
      color: #9C97B8;
      font-size: 12px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    #pickBtn {
      background: #6E5CFF;
      color: white;
    }
    #pickBtn:hover { background: #7D6CFF; }
    #fullPageBtn {
      background: #2A2740;
      color: #EDEBFA;
    }
    #fullPageBtn:hover { background: #34304F; }
    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #9C97B8;
      min-height: 16px;
    }
    #status.ok { color: #7CE0A8; }
    #status.err { color: #FF8A8A; }
  </style>
</head>
<body>
  <h1>DOM → Figma</h1>
  <p class="sub">Capture a section of this page, then paste it into the companion Figma plugin.</p>
  <button id="pickBtn">Pick an element…</button>
  <button id="fullPageBtn">Capture full page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
